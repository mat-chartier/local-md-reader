  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
      background: #f5f5f5;
      color: #333;
      display: flex;
      flex-direction: column;
      height: 100vh;
      overflow: hidden;
    }

    header {
      background: white;
      border-bottom: 1px solid #ddd;
      padding: 12px 16px;
      display: flex;
      align-items: center;
      gap: 12px;
      box-shadow: 0 1px 2px rgba(0,0,0,0.05);
    }

    button {
      background: #0066cc;
      color: white;
      border: none;
      padding: 8px 16px;
      border-radius: 6px;
      font-size: 14px;
      cursor: pointer;
      font-weight: 500;
      transition: background 0.2s;
    }

    button:hover {
      background: #0052a3;
    }

    button:active {
      transform: scale(0.98);
    }

    #folderInput {
      display: none;
    }

    .breadcrumb {
      font-size: 13px;
      color: #666;
      flex: 1;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .container {
      display: flex;
      flex: 1;
      overflow: hidden;
      gap: 0;
    }

    .explorer {
      width: 280px;
      background: white;
      overflow: hidden;
      display: flex;
      flex-direction: column;
      min-width: 150px;
    }

    .explorer-header {
      padding: 12px 16px;
      font-size: 12px;
      font-weight: 600;
      color: #666;
      background: #fafafa;
      border-bottom: 1px solid #eee;
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }

    .tree {
      flex: 1;
      overflow-y: auto;
      overflow-x: auto;
    }

    .tree-item {
      user-select: none;
      font-size: 13px;
    }

    .tree-folder, .tree-file {
      padding: 6px 12px;
      display: flex;
      align-items: center;
      gap: 8px;
      cursor: pointer;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .tree-folder {
      font-weight: 500;
      color: #333;
    }

    .tree-folder:hover {
      background: #f0f0f0;
    }

    .tree-file {
      color: #555;
      padding-left: 28px;
    }

    .tree-file:hover {
      background: #f9f9f9;
      color: #0066cc;
    }

    .tree-file.active {
      background: #e6f0ff;
      color: #0066cc;
      font-weight: 500;
    }

    .tree-file.md {
      color: #666;
    }

    .toggle {
      width: 16px;
      height: 16px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 10px;
      flex-shrink: 0;
      color: #999;
    }

    .tree-item.collapsed .children {
      display: none;
    }

    .icon {
      width: 16px;
      flex-shrink: 0;
      text-align: center;
      color: #999;
    }

    .splitter {
      width: 6px;
      background: #ddd;
      cursor: col-resize;
      user-select: none;
      transition: background 0.2s;
      flex-shrink: 0;
    }

    .splitter:hover {
      background: #0066cc;
    }

    .splitter.dragging {
      background: #0066cc;
    }

    .viewer {
      flex: 1;
      display: flex;
      flex-direction: column;
      background: white;
      overflow: hidden;
      min-width: 300px;
    }

    .tabs-container {
      display: flex;
      align-items: center;
      gap: 0;
      border-bottom: 1px solid #eee;
      background: white;
      overflow-x: auto;
      overflow-y: hidden;
      height: 40px;
      padding: 0 8px;
      flex-shrink: 0;
    }

    .tab {
      display: flex;
      align-items: center;
      gap: 8px;
      padding: 8px 12px;
      background: #f5f5f5;
      border: 1px solid #ddd;
      border-bottom: none;
      border-radius: 4px 4px 0 0;
      cursor: pointer;
      font-size: 13px;
      color: #666;
      white-space: nowrap;
      margin-right: 4px;
      transition: all 0.2s;
      flex-shrink: 0;
    }

    .tab:hover {
      background: #efefef;
    }

    .tab.active {
      background: white;
      color: #0066cc;
      font-weight: 500;
      border-color: #ddd;
    }

    .tab-close {
      width: 16px;
      height: 16px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 12px;
      cursor: pointer;
      opacity: 0.6;
      transition: opacity 0.2s;
    }

    .tab-close:hover {
      opacity: 1;
    }

    .viewer-content {
      flex: 1;
      overflow-y: auto;
      padding: 24px 32px;
    }

    .empty-state {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      height: 100%;
      color: #999;
      text-align: center;
    }

    .empty-state p {
      font-size: 14px;
      line-height: 1.5;
    }

    .markdown-content h1,
    .markdown-content h2,
    .markdown-content h3,
    .markdown-content h4,
    .markdown-content h5,
    .markdown-content h6 {
      margin-top: 24px;
      margin-bottom: 12px;
      font-weight: 600;
      line-height: 1.3;
    }

    .markdown-content h1 {
      font-size: 28px;
      border-bottom: 2px solid #eee;
      padding-bottom: 12px;
    }

    .markdown-content h2 {
      font-size: 22px;
    }

    .markdown-content h3 {
      font-size: 18px;
    }

    .markdown-content h4,
    .markdown-content h5,
    .markdown-content h6 {
      font-size: 16px;
    }

    .markdown-content p {
      margin-bottom: 12px;
      line-height: 1.6;
    }

    .markdown-content ul,
    .markdown-content ol {
      margin-bottom: 12px;
      padding-left: 24px;
    }

    .markdown-content li {
      margin-bottom: 4px;
      line-height: 1.6;
    }

    .markdown-content code {
      background: #f5f5f5;
      padding: 2px 6px;
      border-radius: 3px;
      font-family: 'Monaco', 'Menlo', 'Ubuntu Mono', monospace;
      font-size: 13px;
      color: #c7254e;
    }

    .markdown-content pre {
      background: #f5f5f5;
      border: 1px solid #ddd;
      border-radius: 4px;
      padding: 12px 16px;
      overflow-x: auto;
      margin-bottom: 12px;
    }

    .plaintext-content {
      font-family: 'Monaco', 'Menlo', 'Ubuntu Mono', monospace;
      font-size: 13px;
      line-height: 1.5;
      color: #333;
      white-space: pre-wrap;
      word-break: break-word;
      margin: 0;
    }

    .markdown-content pre code {
      background: none;
      padding: 0;
      color: #333;
    }

    .markdown-content blockquote {
      border-left: 4px solid #0066cc;
      padding-left: 12px;
      margin-left: 0;
      margin-bottom: 12px;
      color: #666;
    }

    .markdown-content a {
      color: #0066cc;
      text-decoration: none;
    }

    .markdown-content a:hover {
      text-decoration: underline;
    }

    .markdown-content table {
      border-collapse: collapse;
      margin-bottom: 12px;
      font-size: 13px;
      width: 100%;
    }

    .markdown-content table th,
    .markdown-content table td {
      border: 1px solid #ddd;
      padding: 8px 12px;
      text-align: left;
    }

    .markdown-content table th {
      background: #f5f5f5;
      font-weight: 600;
    }

    .markdown-content img {
      max-width: 100%;
      height: auto;
      margin-bottom: 12px;
    }

    .security-warning {
      background: #fff3cd;
      border: 1px solid #ffc107;
      color: #856404;
      padding: 12px;
      border-radius: 4px;
      margin-bottom: 12px;
      font-size: 12px;
    }

    .browser-hint {
      background: #fff3cd;
      border-bottom: 1px solid #ffc107;
      color: #856404;
      padding: 6px 16px;
      font-size: 12px;
    }

    .browser-hint code {
      background: rgba(0,0,0,0.06);
      padding: 1px 4px;
      border-radius: 3px;
    }

    @media (max-width: 768px) {
      .container {
        flex-direction: column;
      }

      .explorer {
        width: 100%;
        max-height: 200px;
        border-right: none;
        border-bottom: 1px solid #ddd;
      }

      .viewer-content {
        padding: 16px;
      }
    }

    @media (prefers-color-scheme: dark) {
      body {
        background: #1e1e1e;
        color: #e0e0e0;
      }

      header, .explorer, .viewer {
        background: #2a2a2a;
      }

      .breadcrumb, .explorer-header {
        color: #999;
      }

      .explorer-header {
        background: #1e1e1e;
      }

      .splitter {
        background: #3a3a3a;
      }

      .splitter:hover, .splitter.dragging {
        background: #0088ff;
      }

      .tabs-container {
        background: #2a2a2a;
        border-bottom-color: #3a3a3a;
      }

      .tab {
        background: #1e1e1e;
        border-color: #3a3a3a;
        color: #999;
      }

      .tab:hover {
        background: #3a3a3a;
      }

      .tab.active {
        background: #2a2a2a;
        color: #66b3ff;
        border-color: #3a3a3a;
      }

      .tree-folder, .tree-file {
        color: #e0e0e0;
      }

      .tree-folder:hover, .tree-file:hover {
        background: #3a3a3a;
      }

      .tree-file.active {
        background: #1a3a4f;
        color: #66b3ff;
      }

      .viewer-content {
        background: #2a2a2a;
      }

      .empty-state {
        color: #666;
      }

      .markdown-content {
        color: #e0e0e0;
      }

      .markdown-content h1 {
        border-bottom-color: #3a3a3a;
      }

      .markdown-content code {
        background: #1e1e1e;
        color: #ff6b9d;
      }

      .markdown-content pre {
        background: #1e1e1e;
        border-color: #3a3a3a;
      }

      .plaintext-content {
        color: #e0e0e0;
      }

      .markdown-content blockquote {
        border-left-color: #0088ff;
        color: #999;
      }

      .markdown-content table th {
        background: #1e1e1e;
      }

      .markdown-content table th,
      .markdown-content table td {
        border-color: #3a3a3a;
      }

      button {
        background: #0077e6;
      }

      button:hover {
        background: #0066cc;
      }

      header {
        border-bottom-color: #3a3a3a;
      }

      .explorer {
        border-right-color: #3a3a3a;
      }

      .browser-hint {
        background: #3a3320;
        border-bottom-color: #6b5b16;
        color: #ffd970;
      }

      .browser-hint code {
        background: rgba(255,255,255,0.1);
      }
    }
  </style>
</head>
<body>
  <header>
    <button id="openFolderBtn">📁 Open Folder</button>
    <button id="refreshBtn" style="display: none;">🔄 Refresh</button>
    <button id="toggleSourceBtn" style="display: none;">&lt;/&gt; Source</button>
    <button id="scrollTopBtn" style="display: none;">⬆ Top</button>
    <input type="file" id="folderInput" webkitdirectory>
    <div class="breadcrumb" id="breadcrumb">Select a folder to begin</div>
  </header>

  <div id="browserHint" class="browser-hint" style="display: none;">
    💡 For the full folder explorer — browse into <em>any</em> sub-folder, no up-front scan — open this page in <strong>Chrome</strong> or <strong>Edge</strong>. Other browsers still work with a one-time flat listing of your text files.
  </div>

  <div class="container">
    <div class="explorer">
      <div class="explorer-header">Files</div>
      <div class="tree" id="tree"></div>
    </div>

    <div class="splitter" id="splitter"></div>

    <div class="viewer">
      <div class="tabs-container" id="tabsContainer"></div>
      <div class="viewer-content" id="viewerContent">
        <div class="empty-state">
          <p>👈 Select a file on the left to start</p>
        </div>
      </div>
    </div>
  </div>

  <script>
    // ====================================================================
    // SECURITY: DEBUG MODE TOGGLE
    // Set to false in production to disable all console logs
    // ====================================================================
    const DEBUG = false;

    const log = DEBUG ? console.log : () => {};
    const warn = DEBUG ? console.warn : () => {};
    const error = DEBUG ? console.error : () => {};

    // ====================================================================
    // SECURITY: MAX FILE SIZE (10 MB)
    // Prevent loading huge files into memory
    // ====================================================================
    const MAX_FILE_SIZE = 10 * 1024 * 1024;  // 10 MB

    // ====================================================================
    // VIEWABLE FILE TYPES
    // markdown -> rendered via marked ; html -> sanitized render + source
    // toggle ; everything else in the list -> shown as plain text.
    // ====================================================================
    const MARKDOWN_EXTENSIONS = ['.md', '.markdown'];
    const HTML_EXTENSIONS = ['.html', '.htm'];
    const TEXT_EXTENSIONS = [
      '.txt', '.text', '.log', '.csv', '.tsv', '.json', '.xml', '.yml', '.yaml',
      '.ini', '.toml', '.conf', '.cfg', '.env', '.properties',
      '.js', '.mjs', '.cjs', '.ts', '.tsx', '.jsx', '.css', '.scss', '.less',
      '.py', '.rb', '.php', '.go', '.rs', '.java', '.kt', '.c', '.h', '.cpp',
      '.hpp', '.cs', '.swift', '.sh', '.bash', '.zsh', '.ps1', '.sql', '.r',
      '.pl', '.lua', '.dart', '.gradle', '.svg'
    ];
    const ALLOWED_EXTENSIONS = [...MARKDOWN_EXTENSIONS, ...HTML_EXTENSIONS, ...TEXT_EXTENSIONS];

    function fileKind(name) {
      const n = name.toLowerCase();
      if (MARKDOWN_EXTENSIONS.some(e => n.endsWith(e))) return 'markdown';
      if (HTML_EXTENSIONS.some(e => n.endsWith(e))) return 'html';
      return 'text';
    }

    function fileIcon(name) {
      const k = fileKind(name);
      return k === 'html' ? '🌐' : (k === 'markdown' ? '📄' : '📃');
    }

    let fileSystem = null;
    let tabs = [];
    let activeTabIndex = -1;

    // ====================================================================
    // FOLDER REFRESH
    // The File System Access API (Chromium) hands back a live directory
    // handle we can re-read on demand. The legacy webkitdirectory input
    // only yields a frozen snapshot, so on browsers without the API we
    // fall back to re-opening the native picker.
    // ====================================================================
    const supportsFsAccess = 'showDirectoryPicker' in window;
    let dirHandle = null;                 // live handle when FS Access is used
    let expandedFolders = new Set();      // folder paths kept open across renders
    let pendingRefresh = false;           // true = next input selection is a refresh, not a fresh open

    const refreshBtn = document.getElementById('refreshBtn');
    refreshBtn.title = supportsFsAccess
      ? 'Reload files from the current folder'
      : 'Re-pick the folder to reload (keeps your open tabs and expanded folders)';

    if (!supportsFsAccess) {
      document.getElementById('browserHint').style.display = 'block';
    }

    document.getElementById('openFolderBtn').addEventListener('click', openFolder);
    refreshBtn.addEventListener('click', refreshFolder);

    document.getElementById('toggleSourceBtn').addEventListener('click', () => {
      const tab = tabs[activeTabIndex];
      if (!tab || tab.kind !== 'html') return;
      tab.view = tab.view === 'source' ? 'preview' : 'source';
      renderTabView(tab);
    });

    document.getElementById('scrollTopBtn').addEventListener('click', () => {
      document.getElementById('viewerContent').scrollTop = 0;
    });

    document.getElementById('folderInput').addEventListener('change', handleFolderSelect);

    initSplitter();

    async function openFolder() {
      if (supportsFsAccess) {
        try {
          const handle = await window.showDirectoryPicker();
          dirHandle = handle;
          expandedFolders = new Set();
          await loadFromDirHandle({ resetTabs: true });
          return;
        } catch (err) {
          if (err && err.name === 'AbortError') return;  // user cancelled
          error('[FS] showDirectoryPicker failed, falling back to input:', err);
        }
      }
      // Fallback: legacy folder picker (no live handle), fresh open
      dirHandle = null;
      pendingRefresh = false;
      document.getElementById('folderInput').click();
    }

    async function refreshFolder() {
      if (dirHandle) {
        await loadFromDirHandle({ resetTabs: false });
        return;
      }
      // No live handle (Firefox/Safari): re-pick the folder, but preserve state.
      pendingRefresh = true;
      const input = document.getElementById('folderInput');
      input.value = '';   // ensure `change` fires even if the same folder is re-chosen
      input.click();
    }

    async function loadFromDirHandle({ resetTabs }) {
      // Make sure we still hold read permission for the handle
      if (dirHandle.queryPermission) {
        let perm = await dirHandle.queryPermission({ mode: 'read' });
        if (perm !== 'granted' && dirHandle.requestPermission) {
          perm = await dirHandle.requestPermission({ mode: 'read' });
        }
        if (perm !== 'granted') {
          updateBreadcrumb('❌ Permission to read the folder was denied');
          return;
        }
      }

      // Lazy explorer: do NOT scan recursively up-front. Only the folder's
      // immediate entries are listed; sub-folders are read when expanded.
      // The in-memory `fileSystem` tree is used by the fallback path only.
      fileSystem = null;

      if (resetTabs) {
        tabs = [];
        activeTabIndex = -1;
      } else {
        await reconcileTabsLazy();
      }

      try {
        await renderLazyChildrenInto(dirHandle, document.getElementById('tree'), 0, dirHandle.name);
      } catch (err) {
        error('[FS] Failed to read directory:', err);
        updateBreadcrumb('❌ Could not read the folder — try re-opening it');
        return;
      }

      renderTabs();
      refreshBtn.style.display = 'inline-block';

      if (resetTabs || tabs.length === 0) {
        showEmptyState();
      }
      if (!resetTabs && activeTabIndex >= 0 && activeTabIndex < tabs.length) {
        loadAndRenderTab(activeTabIndex);
      }

      updateBreadcrumb(`${resetTabs ? '📁' : '🔄'} ${dirHandle.name}`);
    }

    // List one directory's immediate children into `parentEl`. Folders are
    // ALWAYS shown (even with no markdown inside); only .md/.markdown files
    // are listed. Sub-folders are rendered lazily on first expand.
    async function renderLazyChildrenInto(directoryHandle, parentEl, depth, parentPath) {
      parentEl.innerHTML = '';
      const dirs = [];
      const files = [];
      for await (const entry of directoryHandle.values()) {
        if (entry.kind === 'directory') {
          dirs.push(entry);
        } else if (entry.kind === 'file' &&
                   ALLOWED_EXTENSIONS.some(ext => entry.name.toLowerCase().endsWith(ext))) {
          files.push(entry);
        }
      }
      dirs.sort((a, b) => a.name.localeCompare(b.name));
      files.sort((a, b) => a.name.localeCompare(b.name));

      dirs.forEach(handle =>
        parentEl.appendChild(makeFolderEl(handle, depth, `${parentPath}/${handle.name}`)));
      files.forEach(handle =>
        parentEl.appendChild(makeFileEl(handle, depth, `${parentPath}/${handle.name}`)));
    }

    function makeFolderEl(directoryHandle, depth, path) {
      const wasExpanded = expandedFolders.has(path);

      const itemEl = document.createElement('div');
      itemEl.className = 'tree-item' + (wasExpanded ? '' : ' collapsed');
      itemEl.style.paddingLeft = depth * 12 + 'px';
      itemEl.innerHTML = `
        <div class="tree-folder">
          <div class="toggle">${wasExpanded ? '▼' : '▶'}</div>
          <div class="icon">📁</div>
          <span>${escapeHtml(directoryHandle.name)}</span>
        </div>
        <div class="children"></div>
      `;

      const toggle = itemEl.querySelector('.toggle');
      const childrenEl = itemEl.querySelector('.children');
      let loaded = false;

      const expand = async () => {
        if (!loaded) {
          loaded = true;
          try {
            await renderLazyChildrenInto(directoryHandle, childrenEl, depth + 1, path);
          } catch (err) {
            loaded = false;
            error('[FS] Failed to list folder:', path, err);
            return;
          }
        }
        itemEl.classList.remove('collapsed');
        toggle.textContent = '▼';
        expandedFolders.add(path);
      };

      const collapse = () => {
        itemEl.classList.add('collapsed');
        toggle.textContent = '▶';
        expandedFolders.delete(path);
      };

      const onToggle = (e) => {
        if (e) e.stopPropagation();
        if (itemEl.classList.contains('collapsed')) expand();
        else collapse();
      };

      toggle.addEventListener('click', onToggle);
      itemEl.querySelector('.tree-folder').addEventListener('click', onToggle);

      // Restore a previously-expanded folder after a refresh by re-listing it.
      if (wasExpanded) {
        loaded = true;
        renderLazyChildrenInto(directoryHandle, childrenEl, depth + 1, path)
          .catch(err => error('[FS] Failed to restore folder:', path, err));
      }

      return itemEl;
    }

    function makeFileEl(fileHandle, depth, path) {
      const itemEl = document.createElement('div');
      itemEl.className = 'tree-item';
      itemEl.style.paddingLeft = depth * 12 + 'px';
      itemEl.innerHTML = `
        <div class="tree-file md">
          <div class="icon">${fileIcon(fileHandle.name)}</div>
          <span>${escapeHtml(fileHandle.name)}</span>
        </div>
      `;
      const node = { name: fileHandle.name, path, handle: fileHandle };
      itemEl.querySelector('.tree-file').addEventListener('click', () => openTab(node));
      return itemEl;
    }

    async function reconcileTabsLazy() {
      const kept = [];
      for (const tab of tabs) {
        const node = await resolveFileNode(tab.file.path);
        if (node) kept.push({ file: node, raw: null, kind: null, view: tab.view });
      }
      tabs = kept;
      if (activeTabIndex >= tabs.length) activeTabIndex = tabs.length - 1;
    }

    // Resolve a slash path (e.g. "root/sub/doc.md") to a file node, walking the
    // live directory handles in lazy mode, or the in-memory tree in fallback.
    async function resolveFileNode(targetPath) {
      if (dirHandle) {
        const parts = targetPath.split('/').filter(Boolean);
        if (parts.length === 0) return null;
        const start = parts[0] === dirHandle.name ? 1 : 0;
        let dir = dirHandle;
        try {
          for (let i = start; i < parts.length - 1; i++) {
            dir = await dir.getDirectoryHandle(parts[i]);
          }
          const fileHandle = await dir.getFileHandle(parts[parts.length - 1]);
          return { name: fileHandle.name, path: targetPath, handle: fileHandle };
        } catch (err) {
          warn('[FS] Path not found:', targetPath, err);
          return null;
        }
      }
      return findFileByPath(targetPath);
    }

    async function getFileFromNode(node) {
      if (node.handle && node.handle.getFile) return await node.handle.getFile();
      if (node.file instanceof File) return node.file;
      return null;
    }

    function handleFolderSelect(e) {
      const isRefresh = pendingRefresh;
      pendingRefresh = false;

      const entries = Array.from(e.target.files).map(file => ({
        file,
        relativePath: file.webkitRelativePath
      }));
      if (entries.length === 0) {
        updateBreadcrumb(isRefresh ? 'Refresh cancelled' : 'No folder selected');
        return;
      }
      dirHandle = null;                              // input-based selection has no live handle
      if (!isRefresh) expandedFolders = new Set();   // fresh open starts collapsed; refresh keeps state
      ingestEntries(entries, { resetTabs: !isRefresh });
    }

    function ingestEntries(entries, { resetTabs = true } = {}) {
      // ====================================================================
      // SECURITY: VALIDATE FILES BEFORE LOADING
      // ====================================================================
      const validEntries = entries.filter(({ file }) => {
        const hasValidExt = ALLOWED_EXTENSIONS.some(ext =>
          file.name.toLowerCase().endsWith(ext)
        );
        if (!hasValidExt) {
          log(`[INFO] Skipped unsupported file: ${file.name}`);
          return false;
        }
        if (file.size > MAX_FILE_SIZE) {
          error(`[SECURITY] File too large (${file.size} bytes): ${file.name}`);
          return false;
        }
        return true;
      });

      const skippedCount = entries.length - validEntries.length;

      if (validEntries.length === 0) {
        updateBreadcrumb(`❌ No viewable files found (${skippedCount} unsupported files ignored)`);
        fileSystem = null;
        tabs = [];
        activeTabIndex = -1;
        document.getElementById('tree').innerHTML = '<p style="color: var(--text-secondary); padding: 10px;">No viewable text files in this folder</p>';
        renderTabs();
        refreshBtn.style.display = 'inline-block';
        return;
      }

      const loaded = skippedCount > 0
        ? `Loaded ${validEntries.length} file(s), ignored ${skippedCount} other file(s)`
        : `Loaded ${validEntries.length} file(s)`;
      log(`[INFO] ${loaded}`);

      fileSystem = buildFileTree(validEntries);

      if (resetTabs) {
        tabs = [];
        activeTabIndex = -1;
      } else {
        // Refresh: keep tabs whose file still exists, re-pointed at the
        // fresh File object (cache dropped so content changes show up).
        reconcileTabs();
      }

      renderTree();
      renderTabs();
      refreshBtn.style.display = 'inline-block';

      if (!resetTabs) {
        if (activeTabIndex >= 0 && activeTabIndex < tabs.length) {
          loadAndRenderTab(activeTabIndex);
        } else if (tabs.length === 0) {
          showEmptyState();
        }
      }

      updateBreadcrumb(`${resetTabs ? '✅' : '🔄'} ${loaded}`);
    }

    function reconcileTabs() {
      const oldTabs = tabs;
      tabs = [];  // clear first so findFileByPath doesn't return stale nodes
      const kept = [];
      for (const oldTab of oldTabs) {
        const node = findFileByPath(oldTab.file.path);
        if (node) kept.push({ file: node, raw: null, kind: null, view: oldTab.view });
      }
      tabs = kept;
      if (activeTabIndex >= tabs.length) activeTabIndex = tabs.length - 1;
    }

    function buildFileTree(entries) {
      const root = { name: '', children: new Map(), isFolder: true };

      entries.forEach(({ file, relativePath }) => {
        const parts = relativePath.split('/');
        let current = root;

        parts.forEach((part, index) => {
          if (!current.children.has(part)) {
            current.children.set(part, {
              name: part,
              children: new Map(),
              isFolder: index < parts.length - 1,
              file: index === parts.length - 1 ? file : null,
              path: relativePath
            });
          }
          current = current.children.get(part);
        });
      });

      return root;
    }

    function renderTree(node = null, parentEl = null, depth = 0, parentPath = '') {
      if (!fileSystem) return;

      if (!node) {
        document.getElementById('tree').innerHTML = '';
        node = fileSystem;
        parentEl = document.getElementById('tree');
      }

      const sortedEntries = Array.from(node.children.values()).sort((a, b) => {
        if (a.isFolder !== b.isFolder) return a.isFolder ? -1 : 1;
        return a.name.localeCompare(b.name);
      });

      sortedEntries.forEach(item => {
        if (!item.name) return;

        const itemPath = parentPath ? `${parentPath}/${item.name}` : item.name;
        const isExpanded = item.isFolder && expandedFolders.has(itemPath);

        const itemEl = document.createElement('div');
        itemEl.className = 'tree-item' + (isExpanded ? '' : ' collapsed');
        itemEl.style.paddingLeft = depth * 12 + 'px';

        if (item.isFolder) {
          itemEl.innerHTML = `
            <div class="tree-folder">
              <div class="toggle">${isExpanded ? '▼' : '▶'}</div>
              <div class="icon">📁</div>
              <span>${escapeHtml(item.name)}</span>
            </div>
            <div class="children"></div>
          `;

          const toggle = itemEl.querySelector('.toggle');
          const childrenEl = itemEl.querySelector('.children');

          toggle.addEventListener('click', (e) => {
            e.stopPropagation();
            const nowCollapsed = itemEl.classList.toggle('collapsed');
            toggle.textContent = nowCollapsed ? '▶' : '▼';
            if (nowCollapsed) expandedFolders.delete(itemPath);
            else expandedFolders.add(itemPath);
          });

          itemEl.querySelector('.tree-folder').addEventListener('click', () => {
            toggle.click();
          });

          renderTree(item, childrenEl, depth + 1, itemPath);
        } else if (ALLOWED_EXTENSIONS.some(ext => item.name.toLowerCase().endsWith(ext))) {
          itemEl.innerHTML = `
            <div class="tree-file md">
              <div class="icon">${fileIcon(item.name)}</div>
              <span>${escapeHtml(item.name)}</span>
            </div>
          `;

          itemEl.querySelector('.tree-file').addEventListener('click', () => {
            openTab(item);
          });
        }

        parentEl.appendChild(itemEl);
      });
    }

    function openTab(fileObj, anchor = null) {
      const existingIndex = tabs.findIndex(t => t.file.path === fileObj.path);
      
      if (existingIndex !== -1) {
        activeTabIndex = existingIndex;
      } else {
        tabs.push({
          file: fileObj,
          raw: null,
          kind: null,
          view: 'preview'
        });
        activeTabIndex = tabs.length - 1;
      }

      renderTabs();
      loadAndRenderTab(activeTabIndex, anchor);
      updateBreadcrumb();
    }

    function closeTab(index) {
      tabs.splice(index, 1);

      if (activeTabIndex >= tabs.length) {
        activeTabIndex = tabs.length - 1;
      }

      if (tabs.length === 0) {
        activeTabIndex = -1;
        showEmptyState();
      } else {
        loadAndRenderTab(activeTabIndex);
      }

      renderTabs();
      updateBreadcrumb();
    }

    function renderTabs() {
      const tabsContainer = document.getElementById('tabsContainer');
      tabsContainer.innerHTML = '';

      tabs.forEach((tab, index) => {
        const tabEl = document.createElement('div');
        tabEl.className = 'tab' + (index === activeTabIndex ? ' active' : '');

        const nameEl = document.createElement('span');
        nameEl.textContent = tab.file.name;

        const closeEl = document.createElement('div');
        closeEl.className = 'tab-close';
        closeEl.textContent = '×';

        closeEl.addEventListener('click', (e) => {
          e.stopPropagation();
          closeTab(index);
        });

        tabEl.appendChild(nameEl);
        tabEl.appendChild(closeEl);

        tabEl.addEventListener('click', () => {
          activeTabIndex = index;
          renderTabs();
          loadAndRenderTab(index);
          updateBreadcrumb();
        });

        tabsContainer.appendChild(tabEl);
      });
    }

    // ====================================================================
    // SECURITY: DOMPurify configs. Markdown uses a tight whitelist; HTML
    // files use a broader (but still safe) one. Scripts, event handlers,
    // and framing/embedding tags are stripped in both; external network
    // resources are additionally blocked by the CSP.
    // ====================================================================
    const MD_SANITIZE = {
      ALLOWED_TAGS: [
        'h1', 'h2', 'h3', 'h4', 'h5', 'h6',
        'p', 'br', 'strong', 'em', 'u', 'del',
        'ul', 'ol', 'li',
        'blockquote',
        'pre', 'code',
        'a',
        'img',
        'table', 'thead', 'tbody', 'tr', 'th', 'td',
        'hr'
      ],
      ALLOWED_ATTR: ['href', 'title', 'alt', 'src', 'width', 'height', 'id'],
      KEEP_CONTENT: true,
      ALLOW_DATA_ATTR: false
    };

    const HTML_SANITIZE = {
      ALLOWED_TAGS: [
        'h1', 'h2', 'h3', 'h4', 'h5', 'h6',
        'p', 'br', 'hr', 'strong', 'em', 'b', 'i', 'u', 's', 'del', 'ins',
        'small', 'mark', 'sub', 'sup', 'abbr', 'cite', 'q', 'kbd', 'samp',
        'var', 'time', 'address',
        'ul', 'ol', 'li', 'dl', 'dt', 'dd',
        'blockquote', 'pre', 'code',
        'a', 'img',
        'table', 'thead', 'tbody', 'tfoot', 'tr', 'th', 'td', 'caption', 'colgroup', 'col',
        'div', 'span', 'section', 'article', 'header', 'footer', 'nav', 'aside',
        'main', 'figure', 'figcaption', 'details', 'summary'
      ],
      ALLOWED_ATTR: [
        'href', 'title', 'alt', 'src', 'width', 'height', 'id', 'class', 'style',
        'colspan', 'rowspan', 'scope', 'align', 'start', 'reversed', 'type',
        'datetime', 'lang', 'dir'
      ],
      ALLOW_DATA_ATTR: false,
      FORBID_TAGS: ['script', 'style', 'iframe', 'object', 'embed', 'form', 'input',
                    'button', 'textarea', 'select', 'base', 'link', 'meta'],
      FORBID_ATTR: ['srcset', 'ping', 'target', 'formaction']
    };

    async function loadAndRenderTab(index, anchorToScroll = null) {
      if (index < 0 || index >= tabs.length) return;

      const tab = tabs[index];

      // Read (and cache) the raw text once; parsing/rendering is cheap and
      // re-done on tab switch or source/preview toggle.
      if (tab.raw == null) {
        let file;
        try {
          file = await getFileFromNode(tab.file);
        } catch (err) {
          error('[SECURITY] Could not read file:', err);
          updateBreadcrumb('❌ Could not read the file — the folder may have changed');
          return;
        }
        if (!file) {
          error('[SECURITY] Invalid file object.');
          return;
        }

        // ================================================================
        // SECURITY: enforce the size cap at read time (lazy entries are not
        // pre-validated), before pulling the whole file into memory.
        // ================================================================
        if (file.size > MAX_FILE_SIZE) {
          error(`[SECURITY] File too large (${file.size} bytes): ${file.name}`);
          updateBreadcrumb(`❌ File too large (max 10MB): ${file.name}`);
          return;
        }

        tab.raw = await file.text();
        tab.kind = fileKind(tab.file.name);
        if (tab.view == null) tab.view = 'preview';
      }

      renderTabView(tab, anchorToScroll);
    }

    function renderTabView(tab, anchorToScroll = null) {
      // ====================================================================
      // SECURITY: markdown and HTML are always sanitized before insertion;
      // plain text is rendered via textContent (never interpreted as HTML).
      // ====================================================================
      if (tab.kind === 'markdown') {
        const clean = window.DOMPurify.sanitize(marked.parse(tab.raw), MD_SANITIZE);
        renderTabContent(clean, tab.file.path, anchorToScroll);
      } else if (tab.kind === 'html' && tab.view !== 'source') {
        const clean = window.DOMPurify.sanitize(tab.raw, HTML_SANITIZE);
        renderTabContent(clean, tab.file.path, anchorToScroll);
      } else {
        renderPlainText(tab.raw, tab.file.path);
      }
      renderViewToggle(tab);
    }

    function renderPlainText(raw, path) {
      const viewerContent = document.getElementById('viewerContent');
      viewerContent.scrollTop = 0;

      const pre = document.createElement('pre');
      pre.className = 'plaintext-content';
      pre.textContent = raw;              // textContent => no HTML is ever interpreted
      pre.dataset.docPath = path;

      viewerContent.innerHTML = '';
      viewerContent.appendChild(pre);
      document.getElementById('scrollTopBtn').style.display = 'inline-block';
    }

    function renderViewToggle(tab) {
      const btn = document.getElementById('toggleSourceBtn');
      if (tab && tab.kind === 'html') {
        btn.style.display = 'inline-block';
        btn.textContent = tab.view === 'source' ? '👁 Preview' : '</> Source';
      } else {
        btn.style.display = 'none';
      }
    }

    function renderTabContent(html, path, anchorToScroll = null) {
      const viewerContent = document.getElementById('viewerContent');
      const scrollTopBtn = document.getElementById('scrollTopBtn');
      
      viewerContent.scrollTop = 0;
      
      const wrapper = document.createElement('div');
      wrapper.className = 'markdown-content';
      // ⚠️ Already sanitized by DOMPurify above, but use textContent for extra safety
      wrapper.innerHTML = html;

      // Generate normalized IDs for headings (keep any existing id, e.g. in HTML files)
      wrapper.querySelectorAll('h1, h2, h3, h4, h5, h6').forEach(heading => {
        if (!heading.id) heading.id = generateSlug(heading.textContent);
      });

      wrapper.dataset.docPath = path;

      viewerContent.innerHTML = '';
      viewerContent.appendChild(wrapper);

      scrollTopBtn.style.display = 'inline-block';

      // Intercept links with security checks
      wrapper.querySelectorAll('a[href]').forEach(link => {
        link.addEventListener('click', (e) => {
          handleLinkClick(e, path);
        });
      });

      if (anchorToScroll) {
        setTimeout(() => {
          const decodedAnchor = decodeURIComponent(anchorToScroll);
          const normalizedAnchor = normalizeAnchor(decodedAnchor);
          log('🔍 Searching for anchor:', {
            raw: anchorToScroll,
            decoded: decodedAnchor,
            normalized: normalizedAnchor
          });
          
          const allHeadings = wrapper.querySelectorAll('h1, h2, h3, h4, h5, h6');
          const allIds = Array.from(allHeadings).map(h => ({
            id: h.id,
            text: h.textContent
          }));
          log('📋 Available IDs:', allIds);
          
          const target = wrapper.querySelector(`#${CSS.escape(normalizedAnchor)}`);
          if (target) {
            log('✅ Anchor found!');
            target.scrollIntoView({ behavior: 'smooth', block: 'start' });
          } else {
            warn('❌ Anchor not found:', normalizedAnchor);
          }
        }, 50);
      }
    }

    function handleLinkClick(e, currentDocPath) {
      // Use currentTarget (the <a> the listener is bound to), not target,
      // which may be a child element (e.g. <a><code>x</code></a>).
      const href = e.currentTarget.getAttribute('href');
      if (!href) return;

      // ====================================================================
      // SECURITY: ONLY ALLOW SAME-ORIGIN & FRAGMENT LINKS
      // Block external URLs and javascript: protocols
      // ====================================================================
      if (href.startsWith('http://') || href.startsWith('https://')) {
        // External links open in a new tab, isolated from this document.
        e.preventDefault();
        window.open(href, '_blank', 'noopener,noreferrer');
        return;
      }

      if (href.startsWith('javascript:') || href.startsWith('data:')) {
        error('[SECURITY] Blocked dangerous link:', href);
        e.preventDefault();
        return;
      }

      e.preventDefault();

      if (href.startsWith('#')) {
        const anchor = href.substring(1);
        const decodedAnchor = decodeURIComponent(anchor);
        const normalizedAnchor = normalizeAnchor(decodedAnchor);
        log('⚓ Internal anchor:', {
          raw: anchor,
          decoded: decodedAnchor,
          normalized: normalizedAnchor
        });
        const target = document.querySelector(`#${CSS.escape(normalizedAnchor)}`);
        if (target) {
          log('✅ Anchor found');
          target.scrollIntoView({ behavior: 'smooth', block: 'start' });
        } else {
          warn('❌ Anchor not found');
        }
        return;
      }

      const [filePath, rawAnchor] = href.split('#');
      const anchor = rawAnchor ? decodeURIComponent(rawAnchor) : null;
      
      log('🔗 Cross-document link:', {
        href,
        filePath,
        anchor: anchor || '(none)',
        currentDoc: currentDocPath
      });
      
      const resolvedPath = resolveRelativePath(currentDocPath, filePath);
      resolveFileNode(resolvedPath).then(matchingFile => {
        if (matchingFile) {
          log('✅ File found:', resolvedPath);
          openTab(matchingFile, anchor);
        } else {
          warn(`❌ File not found: "${resolvedPath}" (from "${currentDocPath}", link: "${filePath}")`);
        }
      });
    }

    function resolveRelativePath(currentPath, relativePath) {
      const lastSlash = currentPath.lastIndexOf('/');
      const currentDir = lastSlash > -1 ? currentPath.substring(0, lastSlash) : '';
      
      let resolvedParts = currentDir ? currentDir.split('/') : [];
      const relativeParts = relativePath.split('/');

      for (const part of relativeParts) {
        if (part === '..') {
          resolvedParts.pop();
        } else if (part !== '.' && part !== '') {
          resolvedParts.push(part);
        }
      }

      return resolvedParts.join('/');
    }

    function findFileByPath(targetPath) {
      if (!fileSystem) return null;

      for (let tab of tabs) {
        if (tab.file.path === targetPath) {
          return tab.file;
        }
      }

      let current = fileSystem;
      const parts = targetPath.split('/').filter(p => p !== '');

      for (const part of parts) {
        if (!current.children.has(part)) {
          warn(`Path not found in tree. Looking for "${part}" in path "${targetPath}"`);
          warn('Available children:', Array.from(current.children.keys()));
          return null;
        }
        current = current.children.get(part);
      }

      if (!current || !current.file) {
        warn(`Node found but no file object in "${targetPath}"`);
        return null;
      }

      return current;
    }

    function generateSlug(text) {
      // "Section Française" → "section-francaise"
      return text
        .trim()
        .toLowerCase()
        .normalize('NFD')
        .replace(/[\u0300-\u036f]/g, '')
        .replace(/[^\w\s-]/g, '')
        .replace(/\s+/g, '-')
        .replace(/-+/g, '-')
        .replace(/^-+|-+$/g, '');
    }

    function normalizeAnchor(anchor) {
      const normalized = generateSlug(anchor);
      if (anchor !== normalized) {
        log('🔤 Anchor normalization:', anchor, '→', normalized);
      }
      return normalized;
    }

    function showEmptyState() {
      const viewerContent = document.getElementById('viewerContent');
      const scrollTopBtn = document.getElementById('scrollTopBtn');
      scrollTopBtn.style.display = 'none';
      document.getElementById('toggleSourceBtn').style.display = 'none';
      viewerContent.innerHTML = `
        <div class="empty-state">
          <p>👈 Select a file on the left to start</p>
        </div>
      `;
    }

    function updateBreadcrumb(customMessage = null) {
      const breadcrumbEl = document.getElementById('breadcrumb');
      
      if (customMessage) {
        // Use custom message (for status feedback)
        breadcrumbEl.textContent = customMessage;
      } else if (!fileSystem && !dirHandle) {
        breadcrumbEl.textContent = 'Select a folder to begin';
      } else if (activeTabIndex >= 0 && activeTabIndex < tabs.length) {
        breadcrumbEl.textContent = tabs[activeTabIndex].file.path;
      } else {
        const folderName = dirHandle?.name
          || document.getElementById('folderInput').files[0]?.webkitRelativePath.split('/')[0]
          || 'Folder';
        breadcrumbEl.textContent = folderName;
      }
    }

    function escapeHtml(text) {
      const div = document.createElement('div');
      div.textContent = text;
      return div.innerHTML;
    }

    function initSplitter() {
      const splitter = document.getElementById('splitter');
      const explorer = document.querySelector('.explorer');
      const container = document.querySelector('.container');

      let isResizing = false;
      let startX = 0;
      let startWidth = 0;

      splitter.addEventListener('mousedown', (e) => {
        isResizing = true;
        startX = e.clientX;
        startWidth = explorer.offsetWidth;
        splitter.classList.add('dragging');
        document.body.style.userSelect = 'none';
      });

      document.addEventListener('mousemove', (e) => {
        if (!isResizing) return;

        const diff = e.clientX - startX;
        const newWidth = startWidth + diff;
        const containerWidth = container.offsetWidth;
        const minExplorer = 150;
        const minViewer = 300;

        if (newWidth >= minExplorer && containerWidth - newWidth >= minViewer) {
          explorer.style.width = newWidth + 'px';
        }
      });

      document.addEventListener('mouseup', () => {
        if (isResizing) {
          isResizing = false;
          splitter.classList.remove('dragging');
          document.body.style.userSelect = '';
        }
      });
    }
  </script>
</body>
</html>
