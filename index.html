<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta http-equiv="Content-Security-Policy" 
        content="default-src 'none'; 
                 script-src 'self' 'unsafe-inline' https://cdnjs.cloudflare.com https://cdn.jsdelivr.net;
                 style-src 'self' 'unsafe-inline';
                 connect-src 'none';
                 img-src 'self' data:;
                 form-action 'none';
                 frame-ancestors 'none';">
  <title>Local Markdown Reader - Secure Edition</title>
  <!-- Marked.js -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/marked/13.0.1/marked.min.js"
          crossorigin="anonymous"
          referrerpolicy="no-referrer"></script>
  <!-- DOMPurify -->
  <script src="https://cdn.jsdelivr.net/npm/dompurify@3.0.9/dist/purify.min.js"
          crossorigin="anonymous"
          referrerpolicy="no-referrer"></script>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
      background: #f5f5f5;
      color: #333;
      display: flex;
      flex-direction: column;
      height: 100vh;
      overflow: hidden;
    }

    header {
      background: white;
      border-bottom: 1px solid #ddd;
      padding: 12px 16px;
      display: flex;
      align-items: center;
      gap: 12px;
      box-shadow: 0 1px 2px rgba(0,0,0,0.05);
    }

    button {
      background: #0066cc;
      color: white;
      border: none;
      padding: 8px 16px;
      border-radius: 6px;
      font-size: 14px;
      cursor: pointer;
      font-weight: 500;
      transition: background 0.2s;
    }

    button:hover {
      background: #0052a3;
    }

    button:active {
      transform: scale(0.98);
    }

    #folderInput {
      display: none;
    }

    .breadcrumb {
      font-size: 13px;
      color: #666;
      flex: 1;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .container {
      display: flex;
      flex: 1;
      overflow: hidden;
      gap: 0;
    }

    .explorer {
      width: 280px;
      background: white;
      overflow: hidden;
      display: flex;
      flex-direction: column;
      min-width: 150px;
    }

    .explorer-header {
      padding: 12px 16px;
      font-size: 12px;
      font-weight: 600;
      color: #666;
      background: #fafafa;
      border-bottom: 1px solid #eee;
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }

    .tree {
      flex: 1;
      overflow-y: auto;
      overflow-x: auto;
    }

    .tree-item {
      user-select: none;
      font-size: 13px;
    }

    .tree-folder, .tree-file {
      padding: 6px 12px;
      display: flex;
      align-items: center;
      gap: 8px;
      cursor: pointer;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .tree-folder {
      font-weight: 500;
      color: #333;
    }

    .tree-folder:hover {
      background: #f0f0f0;
    }

    .tree-file {
      color: #555;
      padding-left: 28px;
    }

    .tree-file:hover {
      background: #f9f9f9;
      color: #0066cc;
    }

    .tree-file.active {
      background: #e6f0ff;
      color: #0066cc;
      font-weight: 500;
    }

    .tree-file.md {
      color: #666;
    }

    .toggle {
      width: 16px;
      height: 16px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 10px;
      flex-shrink: 0;
      color: #999;
    }

    .tree-item.collapsed .children {
      display: none;
    }

    .icon {
      width: 16px;
      flex-shrink: 0;
      text-align: center;
      color: #999;
    }

    .splitter {
      width: 6px;
      background: #ddd;
      cursor: col-resize;
      user-select: none;
      transition: background 0.2s;
      flex-shrink: 0;
    }

    .splitter:hover {
      background: #0066cc;
    }

    .splitter.dragging {
      background: #0066cc;
    }

    .viewer {
      flex: 1;
      display: flex;
      flex-direction: column;
      background: white;
      overflow: hidden;
      min-width: 300px;
    }

    .tabs-container {
      display: flex;
      align-items: center;
      gap: 0;
      border-bottom: 1px solid #eee;
      background: white;
      overflow-x: auto;
      overflow-y: hidden;
      height: 40px;
      padding: 0 8px;
      flex-shrink: 0;
    }

    .tab {
      display: flex;
      align-items: center;
      gap: 8px;
      padding: 8px 12px;
      background: #f5f5f5;
      border: 1px solid #ddd;
      border-bottom: none;
      border-radius: 4px 4px 0 0;
      cursor: pointer;
      font-size: 13px;
      color: #666;
      white-space: nowrap;
      margin-right: 4px;
      transition: all 0.2s;
      flex-shrink: 0;
    }

    .tab:hover {
      background: #efefef;
    }

    .tab.active {
      background: white;
      color: #0066cc;
      font-weight: 500;
      border-color: #ddd;
    }

    .tab-close {
      width: 16px;
      height: 16px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 12px;
      cursor: pointer;
      opacity: 0.6;
      transition: opacity 0.2s;
    }

    .tab-close:hover {
      opacity: 1;
    }

    .viewer-content {
      flex: 1;
      overflow-y: auto;
      padding: 24px 32px;
    }

    .empty-state {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      height: 100%;
      color: #999;
      text-align: center;
    }

    .empty-state p {
      font-size: 14px;
      line-height: 1.5;
    }

    .markdown-content h1,
    .markdown-content h2,
    .markdown-content h3,
    .markdown-content h4,
    .markdown-content h5,
    .markdown-content h6 {
      margin-top: 24px;
      margin-bottom: 12px;
      font-weight: 600;
      line-height: 1.3;
    }

    .markdown-content h1 {
      font-size: 28px;
      border-bottom: 2px solid #eee;
      padding-bottom: 12px;
    }

    .markdown-content h2 {
      font-size: 22px;
    }

    .markdown-content h3 {
      font-size: 18px;
    }

    .markdown-content h4,
    .markdown-content h5,
    .markdown-content h6 {
      font-size: 16px;
    }

    .markdown-content p {
      margin-bottom: 12px;
      line-height: 1.6;
    }

    .markdown-content ul,
    .markdown-content ol {
      margin-bottom: 12px;
      padding-left: 24px;
    }

    .markdown-content li {
      margin-bottom: 4px;
      line-height: 1.6;
    }

    .markdown-content code {
      background: #f5f5f5;
      padding: 2px 6px;
      border-radius: 3px;
      font-family: 'Monaco', 'Menlo', 'Ubuntu Mono', monospace;
      font-size: 13px;
      color: #c7254e;
    }

    .markdown-content pre {
      background: #f5f5f5;
      border: 1px solid #ddd;
      border-radius: 4px;
      padding: 12px 16px;
      overflow-x: auto;
      margin-bottom: 12px;
    }

    .markdown-content pre code {
      background: none;
      padding: 0;
      color: #333;
    }

    .markdown-content blockquote {
      border-left: 4px solid #0066cc;
      padding-left: 12px;
      margin-left: 0;
      margin-bottom: 12px;
      color: #666;
    }

    .markdown-content a {
      color: #0066cc;
      text-decoration: none;
    }

    .markdown-content a:hover {
      text-decoration: underline;
    }

    .markdown-content table {
      border-collapse: collapse;
      margin-bottom: 12px;
      font-size: 13px;
      width: 100%;
    }

    .markdown-content table th,
    .markdown-content table td {
      border: 1px solid #ddd;
      padding: 8px 12px;
      text-align: left;
    }

    .markdown-content table th {
      background: #f5f5f5;
      font-weight: 600;
    }

    .markdown-content img {
      max-width: 100%;
      height: auto;
      margin-bottom: 12px;
    }

    .security-warning {
      background: #fff3cd;
      border: 1px solid #ffc107;
      color: #856404;
      padding: 12px;
      border-radius: 4px;
      margin-bottom: 12px;
      font-size: 12px;
    }

    @media (max-width: 768px) {
      .container {
        flex-direction: column;
      }

      .explorer {
        width: 100%;
        max-height: 200px;
        border-right: none;
        border-bottom: 1px solid #ddd;
      }

      .viewer-content {
        padding: 16px;
      }
    }

    @media (prefers-color-scheme: dark) {
      body {
        background: #1e1e1e;
        color: #e0e0e0;
      }

      header, .explorer, .viewer {
        background: #2a2a2a;
      }

      .breadcrumb, .explorer-header {
        color: #999;
      }

      .explorer-header {
        background: #1e1e1e;
      }

      .splitter {
        background: #3a3a3a;
      }

      .splitter:hover, .splitter.dragging {
        background: #0088ff;
      }

      .tabs-container {
        background: #2a2a2a;
        border-bottom-color: #3a3a3a;
      }

      .tab {
        background: #1e1e1e;
        border-color: #3a3a3a;
        color: #999;
      }

      .tab:hover {
        background: #3a3a3a;
      }

      .tab.active {
        background: #2a2a2a;
        color: #66b3ff;
        border-color: #3a3a3a;
      }

      .tree-folder, .tree-file {
        color: #e0e0e0;
      }

      .tree-folder:hover, .tree-file:hover {
        background: #3a3a3a;
      }

      .tree-file.active {
        background: #1a3a4f;
        color: #66b3ff;
      }

      .viewer-content {
        background: #2a2a2a;
      }

      .empty-state {
        color: #666;
      }

      .markdown-content {
        color: #e0e0e0;
      }

      .markdown-content h1 {
        border-bottom-color: #3a3a3a;
      }

      .markdown-content code {
        background: #1e1e1e;
        color: #ff6b9d;
      }

      .markdown-content pre {
        background: #1e1e1e;
        border-color: #3a3a3a;
      }

      .markdown-content blockquote {
        border-left-color: #0088ff;
        color: #999;
      }

      .markdown-content table th {
        background: #1e1e1e;
      }

      .markdown-content table th,
      .markdown-content table td {
        border-color: #3a3a3a;
      }

      button {
        background: #0077e6;
      }

      button:hover {
        background: #0066cc;
      }

      header {
        border-bottom-color: #3a3a3a;
      }

      .explorer {
        border-right-color: #3a3a3a;
      }
    }
  </style>
</head>
<body>
  <header>
    <button id="openFolderBtn">📁 Open Folder</button>
    <button id="scrollTopBtn" style="display: none;">⬆ Top</button>
    <input type="file" id="folderInput" webkitdirectory>
    <div class="breadcrumb" id="breadcrumb">Select a folder to begin</div>
  </header>

  <div class="container">
    <div class="explorer">
      <div class="explorer-header">Files</div>
      <div class="tree" id="tree"></div>
    </div>

    <div class="splitter" id="splitter"></div>

    <div class="viewer">
      <div class="tabs-container" id="tabsContainer"></div>
      <div class="viewer-content" id="viewerContent">
        <div class="empty-state">
          <p>👈 Select a .md file on the left to start</p>
        </div>
      </div>
    </div>
  </div>

  <script>
    // ====================================================================
    // SECURITY: DEBUG MODE TOGGLE
    // Set to false in production to disable all console logs
    // ====================================================================
    const DEBUG = false;

    const log = DEBUG ? console.log : () => {};
    const warn = DEBUG ? console.warn : () => {};
    const error = DEBUG ? console.error : () => {};

    // ====================================================================
    // SECURITY: MAX FILE SIZE (10 MB)
    // Prevent loading huge files into memory
    // ====================================================================
    const MAX_FILE_SIZE = 10 * 1024 * 1024;  // 10 MB
    const ALLOWED_EXTENSIONS = ['.md', '.markdown'];

    let fileSystem = null;
    let tabs = [];
    let activeTabIndex = -1;

    document.getElementById('openFolderBtn').addEventListener('click', () => {
      document.getElementById('folderInput').click();
    });

    document.getElementById('scrollTopBtn').addEventListener('click', () => {
      document.getElementById('viewerContent').scrollTop = 0;
    });

    document.getElementById('folderInput').addEventListener('change', handleFolderSelect);

    initSplitter();

    function handleFolderSelect(e) {
      const files = Array.from(e.target.files);
      if (files.length === 0) {
        updateBreadcrumb('No folder selected');
        return;
      }

      // ====================================================================
      // SECURITY: VALIDATE FILES BEFORE LOADING
      // ====================================================================
      const validFiles = files.filter(file => {
        // Check file extension
        const hasValidExt = ALLOWED_EXTENSIONS.some(ext => 
          file.name.toLowerCase().endsWith(ext)
        );
        if (!hasValidExt) {
          log(`[INFO] Skipped non-markdown file: ${file.name}`);
          return false;
        }

        // Check file size
        if (file.size > MAX_FILE_SIZE) {
          error(`[SECURITY] File too large (${file.size} bytes): ${file.name}`);
          return false;
        }

        return true;
      });

      // Count skipped files
      const skippedCount = files.length - validFiles.length;
      let message = '';

      if (validFiles.length === 0) {
        // No markdown files found
        message = `❌ No markdown files found (${skippedCount} non-markdown files ignored)`;
        updateBreadcrumb(message);
        
        // Clear UI to show feedback
        fileSystem = null;
        tabs = [];
        activeTabIndex = -1;
        document.getElementById('tree').innerHTML = '<p style="color: var(--text-secondary); padding: 10px;">No .md or .markdown files in this folder</p>';
        renderTabs();
        return;
      }

      // Show info about loaded files
      if (skippedCount > 0) {
        message = `✅ Loaded ${validFiles.length} markdown file(s), ignored ${skippedCount} other file(s)`;
      } else {
        message = `✅ Loaded ${validFiles.length} markdown file(s)`;
      }
      
      log(`[INFO] ${message}`);
      
      fileSystem = buildFileTree(validFiles);
      tabs = [];
      activeTabIndex = -1;
      renderTree();
      renderTabs();
      updateBreadcrumb(message);
    }

    function buildFileTree(files) {
      const root = { name: '', children: new Map(), isFolder: true };

      files.forEach(file => {
        const parts = file.webkitRelativePath.split('/');
        let current = root;

        parts.forEach((part, index) => {
          if (!current.children.has(part)) {
            current.children.set(part, {
              name: part,
              children: new Map(),
              isFolder: index < parts.length - 1,
              file: index === parts.length - 1 ? file : null,
              path: file.webkitRelativePath
            });
          }
          current = current.children.get(part);
        });
      });

      return root;
    }

    function renderTree(node = null, parentEl = null, depth = 0) {
      if (!fileSystem) return;

      if (!node) {
        document.getElementById('tree').innerHTML = '';
        node = fileSystem;
        parentEl = document.getElementById('tree');
      }

      const sortedEntries = Array.from(node.children.values()).sort((a, b) => {
        if (a.isFolder !== b.isFolder) return a.isFolder ? -1 : 1;
        return a.name.localeCompare(b.name);
      });

      sortedEntries.forEach(item => {
        if (!item.name) return;

        const itemEl = document.createElement('div');
        itemEl.className = 'tree-item collapsed';
        itemEl.style.paddingLeft = depth * 12 + 'px';

        if (item.isFolder) {
          itemEl.innerHTML = `
            <div class="tree-folder">
              <div class="toggle">▶</div>
              <div class="icon">📁</div>
              <span>${escapeHtml(item.name)}</span>
            </div>
            <div class="children"></div>
          `;

          const toggle = itemEl.querySelector('.toggle');
          const childrenEl = itemEl.querySelector('.children');

          toggle.addEventListener('click', (e) => {
            e.stopPropagation();
            itemEl.classList.toggle('collapsed');
            toggle.textContent = itemEl.classList.contains('collapsed') ? '▶' : '▼';
          });

          itemEl.querySelector('.tree-folder').addEventListener('click', () => {
            toggle.click();
          });

          renderTree(item, childrenEl, depth + 1);
        } else if (item.name.toLowerCase().endsWith('.md')) {
          itemEl.innerHTML = `
            <div class="tree-file md">
              <div class="icon">📄</div>
              <span>${escapeHtml(item.name)}</span>
            </div>
          `;

          itemEl.querySelector('.tree-file').addEventListener('click', () => {
            openTab(item);
          });
        }

        parentEl.appendChild(itemEl);
      });
    }

    function openTab(fileObj, anchor = null) {
      const existingIndex = tabs.findIndex(t => t.file.path === fileObj.path);
      
      if (existingIndex !== -1) {
        activeTabIndex = existingIndex;
      } else {
        tabs.push({
          file: fileObj,
          content: null
        });
        activeTabIndex = tabs.length - 1;
      }

      renderTabs();
      loadAndRenderTab(activeTabIndex, anchor);
      updateBreadcrumb();
    }

    function closeTab(index) {
      tabs.splice(index, 1);

      if (activeTabIndex >= tabs.length) {
        activeTabIndex = tabs.length - 1;
      }

      if (tabs.length === 0) {
        activeTabIndex = -1;
        showEmptyState();
      } else {
        loadAndRenderTab(activeTabIndex);
      }

      renderTabs();
      updateBreadcrumb();
    }

    function renderTabs() {
      const tabsContainer = document.getElementById('tabsContainer');
      tabsContainer.innerHTML = '';

      tabs.forEach((tab, index) => {
        const tabEl = document.createElement('div');
        tabEl.className = 'tab' + (index === activeTabIndex ? ' active' : '');

        const nameEl = document.createElement('span');
        nameEl.textContent = tab.file.name;

        const closeEl = document.createElement('div');
        closeEl.className = 'tab-close';
        closeEl.textContent = '×';

        closeEl.addEventListener('click', (e) => {
          e.stopPropagation();
          closeTab(index);
        });

        tabEl.appendChild(nameEl);
        tabEl.appendChild(closeEl);

        tabEl.addEventListener('click', () => {
          activeTabIndex = index;
          renderTabs();
          loadAndRenderTab(index);
          updateBreadcrumb();
        });

        tabsContainer.appendChild(tabEl);
      });
    }

    function loadAndRenderTab(index, anchorToScroll = null) {
      if (index < 0 || index >= tabs.length) return;

      const tab = tabs[index];

      if (tab.content) {
        renderTabContent(tab.content, tab.file.path, anchorToScroll);
      } else {
        if (!tab.file || !tab.file.file || !(tab.file.file instanceof File)) {
          error('[SECURITY] Invalid file object.');
          return;
        }

        const reader = new FileReader();
        reader.onerror = (e) => {
          error('[SECURITY] FileReader error:', e);
        };
        reader.onload = (e) => {
          const markdown = e.target.result;
          
          // ====================================================================
          // SECURITY: PARSE WITH SANITIZATION
          // marked.parse() can create XSS vectors, so we sanitize with DOMPurify
          // ====================================================================
          const html = marked.parse(markdown);
          const clean = window.DOMPurify.sanitize(html, {
            ALLOWED_TAGS: [
              'h1', 'h2', 'h3', 'h4', 'h5', 'h6',
              'p', 'br', 'strong', 'em', 'u', 'del',
              'ul', 'ol', 'li',
              'blockquote',
              'pre', 'code',
              'a',
              'img',
              'table', 'thead', 'tbody', 'tr', 'th', 'td',
              'hr'
            ],
            ALLOWED_ATTR: ['href', 'title', 'alt', 'src', 'width', 'height', 'id'],
            KEEP_CONTENT: true,
            ALLOW_DATA_ATTR: false
          });

          tab.content = clean;
          renderTabContent(clean, tab.file.path, anchorToScroll);
        };
        reader.readAsText(tab.file.file);
      }
    }

    function renderTabContent(html, path, anchorToScroll = null) {
      const viewerContent = document.getElementById('viewerContent');
      const scrollTopBtn = document.getElementById('scrollTopBtn');
      
      viewerContent.scrollTop = 0;
      
      const wrapper = document.createElement('div');
      wrapper.className = 'markdown-content';
      // ⚠️ Already sanitized by DOMPurify above, but use textContent for extra safety
      wrapper.innerHTML = html;

      // Generate normalized IDs for all headings
      wrapper.querySelectorAll('h1, h2, h3, h4, h5, h6').forEach(heading => {
        heading.id = generateSlug(heading.textContent);
      });

      wrapper.dataset.docPath = path;

      viewerContent.innerHTML = '';
      viewerContent.appendChild(wrapper);

      scrollTopBtn.style.display = 'inline-block';

      // Intercept links with security checks
      wrapper.querySelectorAll('a[href]').forEach(link => {
        link.addEventListener('click', (e) => {
          handleLinkClick(e, path);
        });
      });

      if (anchorToScroll) {
        setTimeout(() => {
          const decodedAnchor = decodeURIComponent(anchorToScroll);
          const normalizedAnchor = normalizeAnchor(decodedAnchor);
          log('🔍 Searching for anchor:', {
            raw: anchorToScroll,
            decoded: decodedAnchor,
            normalized: normalizedAnchor
          });
          
          const allHeadings = wrapper.querySelectorAll('h1, h2, h3, h4, h5, h6');
          const allIds = Array.from(allHeadings).map(h => ({
            id: h.id,
            text: h.textContent
          }));
          log('📋 Available IDs:', allIds);
          
          const target = wrapper.querySelector(`#${CSS.escape(normalizedAnchor)}`);
          if (target) {
            log('✅ Anchor found!');
            target.scrollIntoView({ behavior: 'smooth', block: 'start' });
          } else {
            warn('❌ Anchor not found:', normalizedAnchor);
          }
        }, 50);
      }
    }

    function handleLinkClick(e, currentDocPath) {
      const href = e.target.getAttribute('href');
      
      // ====================================================================
      // SECURITY: ONLY ALLOW SAME-ORIGIN & FRAGMENT LINKS
      // Block external URLs and javascript: protocols
      // ====================================================================
      if (href.startsWith('http://') || href.startsWith('https://')) {
        // External links are allowed but will open in new tab
        return;
      }

      if (href.startsWith('javascript:') || href.startsWith('data:')) {
        error('[SECURITY] Blocked dangerous link:', href);
        e.preventDefault();
        return;
      }

      e.preventDefault();

      if (href.startsWith('#')) {
        const anchor = href.substring(1);
        const decodedAnchor = decodeURIComponent(anchor);
        const normalizedAnchor = normalizeAnchor(decodedAnchor);
        log('⚓ Internal anchor:', {
          raw: anchor,
          decoded: decodedAnchor,
          normalized: normalizedAnchor
        });
        const target = document.querySelector(`#${CSS.escape(normalizedAnchor)}`);
        if (target) {
          log('✅ Anchor found');
          target.scrollIntoView({ behavior: 'smooth', block: 'start' });
        } else {
          warn('❌ Anchor not found');
        }
        return;
      }

      const [filePath, rawAnchor] = href.split('#');
      const anchor = rawAnchor ? decodeURIComponent(rawAnchor) : null;
      
      log('🔗 Cross-document link:', {
        href,
        filePath,
        anchor: anchor || '(none)',
        currentDoc: currentDocPath
      });
      
      const resolvedPath = resolveRelativePath(currentDocPath, filePath);
      const matchingFile = findFileByPath(resolvedPath);
      
      if (matchingFile) {
        log('✅ File found:', resolvedPath);
        openTab(matchingFile, anchor);
      } else {
        warn(`❌ File not found: "${resolvedPath}" (from "${currentDocPath}", link: "${filePath}")`);
      }
    }

    function resolveRelativePath(currentPath, relativePath) {
      const lastSlash = currentPath.lastIndexOf('/');
      const currentDir = lastSlash > -1 ? currentPath.substring(0, lastSlash) : '';
      
      let resolvedParts = currentDir ? currentDir.split('/') : [];
      const relativeParts = relativePath.split('/');

      for (const part of relativeParts) {
        if (part === '..') {
          resolvedParts.pop();
        } else if (part !== '.' && part !== '') {
          resolvedParts.push(part);
        }
      }

      return resolvedParts.join('/');
    }

    function findFileByPath(targetPath) {
      if (!fileSystem) return null;

      for (let tab of tabs) {
        if (tab.file.path === targetPath) {
          return tab.file;
        }
      }

      let current = fileSystem;
      const parts = targetPath.split('/').filter(p => p !== '');

      for (const part of parts) {
        if (!current.children.has(part)) {
          warn(`Path not found in tree. Looking for "${part}" in path "${targetPath}"`);
          warn('Available children:', Array.from(current.children.keys()));
          return null;
        }
        current = current.children.get(part);
      }

      if (!current || !current.file) {
        warn(`Node found but no file object in "${targetPath}"`);
        return null;
      }

      return current;
    }

    function generateSlug(text) {
      // "Section Française" → "section-francaise"
      return text
        .trim()
        .toLowerCase()
        .normalize('NFD')
        .replace(/[\u0300-\u036f]/g, '')
        .replace(/[^\w\s-]/g, '')
        .replace(/\s+/g, '-')
        .replace(/-+/g, '-')
        .replace(/^-+|-+$/g, '');
    }

    function normalizeAnchor(anchor) {
      const normalized = generateSlug(anchor);
      if (anchor !== normalized) {
        log('🔤 Anchor normalization:', anchor, '→', normalized);
      }
      return normalized;
    }

    function showEmptyState() {
      const viewerContent = document.getElementById('viewerContent');
      const scrollTopBtn = document.getElementById('scrollTopBtn');
      scrollTopBtn.style.display = 'none';
      viewerContent.innerHTML = `
        <div class="empty-state">
          <p>👈 Select a .md file on the left to start</p>
        </div>
      `;
    }

    function updateBreadcrumb(customMessage = null) {
      const breadcrumbEl = document.getElementById('breadcrumb');
      
      if (customMessage) {
        // Use custom message (for status feedback)
        breadcrumbEl.textContent = customMessage;
      } else if (!fileSystem) {
        breadcrumbEl.textContent = 'Select a folder to begin';
      } else if (activeTabIndex >= 0 && activeTabIndex < tabs.length) {
        breadcrumbEl.textContent = tabs[activeTabIndex].file.path;
      } else {
        const folderName = document.getElementById('folderInput').files[0]?.webkitRelativePath.split('/')[0] || 'Folder';
        breadcrumbEl.textContent = folderName;
      }
    }

    function escapeHtml(text) {
      const div = document.createElement('div');
      div.textContent = text;
      return div.innerHTML;
    }

    function initSplitter() {
      const splitter = document.getElementById('splitter');
      const explorer = document.querySelector('.explorer');
      const container = document.querySelector('.container');

      let isResizing = false;
      let startX = 0;
      let startWidth = 0;

      splitter.addEventListener('mousedown', (e) => {
        isResizing = true;
        startX = e.clientX;
        startWidth = explorer.offsetWidth;
        splitter.classList.add('dragging');
        document.body.style.userSelect = 'none';
      });

      document.addEventListener('mousemove', (e) => {
        if (!isResizing) return;

        const diff = e.clientX - startX;
        const newWidth = startWidth + diff;
        const containerWidth = container.offsetWidth;
        const minExplorer = 150;
        const minViewer = 300;

        if (newWidth >= minExplorer && containerWidth - newWidth >= minViewer) {
          explorer.style.width = newWidth + 'px';
        }
      });

      document.addEventListener('mouseup', () => {
        if (isResizing) {
          isResizing = false;
          splitter.classList.remove('dragging');
          document.body.style.userSelect = '';
        }
      });
    }
  </script>
</body>
</html>
