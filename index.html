<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Explorateur Markdown</title>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/marked/13.0.1/marked.min.js"></script>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
      background: #f5f5f5;
      color: #333;
      display: flex;
      flex-direction: column;
      height: 100vh;
      overflow: hidden;
    }

    header {
      background: white;
      border-bottom: 1px solid #ddd;
      padding: 12px 16px;
      display: flex;
      align-items: center;
      gap: 12px;
      box-shadow: 0 1px 2px rgba(0,0,0,0.05);
    }

    button {
      background: #0066cc;
      color: white;
      border: none;
      padding: 8px 16px;
      border-radius: 6px;
      font-size: 14px;
      cursor: pointer;
      font-weight: 500;
      transition: background 0.2s;
    }

    button:hover {
      background: #0052a3;
    }

    #folderInput {
      display: none;
    }

    .breadcrumb {
      font-size: 13px;
      color: #666;
      flex: 1;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .container {
      display: flex;
      flex: 1;
      overflow: hidden;
      gap: 0;
    }

    .explorer {
      width: 280px;
      background: white;
      overflow: hidden;
      display: flex;
      flex-direction: column;
      min-width: 150px;
    }

    .explorer-header {
      padding: 12px 16px;
      font-size: 12px;
      font-weight: 600;
      color: #666;
      background: #fafafa;
      border-bottom: 1px solid #eee;
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }

    .tree {
      flex: 1;
      overflow-y: auto;
      overflow-x: auto;
    }

    .splitter {
      width: 6px;
      background: #ddd;
      cursor: col-resize;
      user-select: none;
      transition: background 0.2s;
      flex-shrink: 0;
    }

    .splitter:hover {
      background: #0066cc;
    }

    .splitter.dragging {
      background: #0066cc;
    }

    .tree-item {
      user-select: none;
      font-size: 13px;
    }

    .tree-folder, .tree-file {
      padding: 6px 12px;
      display: flex;
      align-items: center;
      gap: 8px;
      cursor: pointer;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .tree-folder {
      font-weight: 500;
      color: #333;
    }

    .tree-folder:hover {
      background: #f0f0f0;
    }

    .tree-file {
      color: #555;
      padding-left: 28px;
    }

    .tree-file:hover {
      background: #f9f9f9;
      color: #0066cc;
    }

    .tree-file.active {
      background: #e6f0ff;
      color: #0066cc;
      font-weight: 500;
    }

    .tree-file.md {
      color: #666;
    }

    .toggle {
      width: 16px;
      height: 16px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 10px;
      flex-shrink: 0;
      color: #999;
    }

    .tree-item.collapsed .children {
      display: none;
    }

    .icon {
      width: 16px;
      flex-shrink: 0;
      text-align: center;
      color: #999;
    }

    .viewer {
      flex: 1;
      display: flex;
      flex-direction: column;
      background: white;
      overflow: hidden;
      min-width: 300px;
    }

    .viewer-header {
      padding: 16px;
      border-bottom: 1px solid #eee;
      background: #fafafa;
      font-size: 13px;
      color: #666;
      font-weight: 500;
      word-break: break-all;
    }

    .tabs-container {
      display: flex;
      align-items: center;
      gap: 0;
      border-bottom: 1px solid #eee;
      background: white;
      overflow-x: auto;
      overflow-y: hidden;
      height: 40px;
      padding: 0 8px;
      flex-shrink: 0;
    }

    .tab {
      display: flex;
      align-items: center;
      gap: 8px;
      padding: 8px 12px;
      background: #f5f5f5;
      border: 1px solid #ddd;
      border-bottom: none;
      border-radius: 4px 4px 0 0;
      cursor: pointer;
      font-size: 13px;
      color: #666;
      white-space: nowrap;
      margin-right: 4px;
      transition: all 0.2s;
      flex-shrink: 0;
    }

    .tab:hover {
      background: #efefef;
    }

    .tab.active {
      background: white;
      color: #0066cc;
      font-weight: 500;
      border-color: #ddd;
    }

    .tab-close {
      width: 16px;
      height: 16px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 12px;
      cursor: pointer;
      opacity: 0.6;
      transition: opacity 0.2s;
    }

    .tab-close:hover {
      opacity: 1;
    }

    .viewer-content {
      flex: 1;
      overflow-y: auto;
      padding: 24px 32px;
    }

    .empty-state {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      height: 100%;
      color: #999;
      text-align: center;
    }

    .empty-state p {
      font-size: 14px;
      line-height: 1.5;
    }

    .markdown-content h1,
    .markdown-content h2,
    .markdown-content h3,
    .markdown-content h4,
    .markdown-content h5,
    .markdown-content h6 {
      margin-top: 24px;
      margin-bottom: 12px;
      font-weight: 600;
      line-height: 1.3;
    }

    .markdown-content h1 {
      font-size: 28px;
      border-bottom: 2px solid #eee;
      padding-bottom: 12px;
    }

    .markdown-content h2 {
      font-size: 22px;
    }

    .markdown-content h3 {
      font-size: 18px;
    }

    .markdown-content h4,
    .markdown-content h5,
    .markdown-content h6 {
      font-size: 16px;
    }

    .markdown-content p {
      margin-bottom: 12px;
      line-height: 1.6;
    }

    .markdown-content ul,
    .markdown-content ol {
      margin-bottom: 12px;
      padding-left: 24px;
    }

    .markdown-content li {
      margin-bottom: 4px;
      line-height: 1.6;
    }

    .markdown-content code {
      background: #f5f5f5;
      padding: 2px 6px;
      border-radius: 3px;
      font-family: 'Monaco', 'Menlo', 'Ubuntu Mono', monospace;
      font-size: 13px;
      color: #c7254e;
    }

    .markdown-content pre {
      background: #f5f5f5;
      border: 1px solid #ddd;
      border-radius: 4px;
      padding: 12px 16px;
      overflow-x: auto;
      margin-bottom: 12px;
    }

    .markdown-content pre code {
      background: none;
      padding: 0;
      color: #333;
    }

    .markdown-content blockquote {
      border-left: 4px solid #0066cc;
      padding-left: 12px;
      margin-left: 0;
      margin-bottom: 12px;
      color: #666;
    }

    .markdown-content a {
      color: #0066cc;
      text-decoration: none;
    }

    .markdown-content a:hover {
      text-decoration: underline;
    }

    .markdown-content table {
      border-collapse: collapse;
      margin-bottom: 12px;
      font-size: 13px;
      width: 100%;
    }

    .markdown-content table th,
    .markdown-content table td {
      border: 1px solid #ddd;
      padding: 8px 12px;
      text-align: left;
    }

    .markdown-content table th {
      background: #f5f5f5;
      font-weight: 600;
    }

    .markdown-content img {
      max-width: 100%;
      height: auto;
      margin-bottom: 12px;
    }

    @media (max-width: 768px) {
      .container {
        flex-direction: column;
      }

      .explorer {
        width: 100%;
        max-height: 200px;
        border-right: none;
        border-bottom: 1px solid #ddd;
      }

      .viewer-content {
        padding: 16px;
      }
    }

    @media (prefers-color-scheme: dark) {
      body {
        background: #1e1e1e;
        color: #e0e0e0;
      }

      header, .explorer, .viewer {
        background: #2a2a2a;
      }

      .breadcrumb, .explorer-header {
        color: #999;
      }

      .explorer-header {
        background: #1e1e1e;
      }

      .splitter {
        background: #3a3a3a;
      }

      .splitter:hover, .splitter.dragging {
        background: #0088ff;
      }

      .tabs-container {
        background: #2a2a2a;
        border-bottom-color: #3a3a3a;
      }

      .tab {
        background: #1e1e1e;
        border-color: #3a3a3a;
        color: #999;
      }

      .tab:hover {
        background: #3a3a3a;
      }

      .tab.active {
        background: #2a2a2a;
        color: #66b3ff;
        border-color: #3a3a3a;
      }

      .tree-folder, .tree-file {
        color: #e0e0e0;
      }

      .tree-folder:hover, .tree-file:hover {
        background: #3a3a3a;
      }

      .tree-file.active {
        background: #1a3a4f;
        color: #66b3ff;
      }

      .viewer-header {
        background: #1e1e1e;
        color: #999;
      }

      .viewer-content {
        background: #2a2a2a;
      }

      .empty-state {
        color: #666;
      }

      .markdown-content {
        color: #e0e0e0;
      }

      .markdown-content h1 {
        border-bottom-color: #3a3a3a;
      }

      .markdown-content code {
        background: #1e1e1e;
        color: #ff6b9d;
      }

      .markdown-content pre {
        background: #1e1e1e;
        border-color: #3a3a3a;
      }

      .markdown-content blockquote {
        border-left-color: #0088ff;
        color: #999;
      }

      .markdown-content table th {
        background: #1e1e1e;
      }

      .markdown-content table th,
      .markdown-content table td {
        border-color: #3a3a3a;
      }

      button {
        background: #0077e6;
      }

      button:hover {
        background: #0066cc;
      }

      header {
        border-bottom-color: #3a3a3a;
      }

      .explorer {
        border-right-color: #3a3a3a;
      }

      .viewer-header {
        border-bottom-color: #3a3a3a;
      }
    }
  </style>
</head>
<body>
  <header>
    <button id="openFolderBtn">📁 Ouvrir dossier</button>
    <button id="scrollTopBtn" style="display: none;">⬆ Haut</button>
    <input type="file" id="folderInput" webkitdirectory>
    <div class="breadcrumb" id="breadcrumb">Sélectionnez un dossier pour commencer</div>
  </header>

  <div class="container">
    <div class="explorer">
      <div class="explorer-header">Fichiers</div>
      <div class="tree" id="tree"></div>
    </div>

    <div class="splitter" id="splitter"></div>

    <div class="viewer">
      <div class="tabs-container" id="tabsContainer"></div>
      <div class="viewer-content" id="viewerContent">
        <div class="empty-state">
          <p>👈 Sélectionnez un fichier .md à gauche pour commencer</p>
        </div>
      </div>
    </div>
  </div>

  <script>
    let fileSystem = null;
    let tabs = [];
    let activeTabIndex = -1;

    document.getElementById('openFolderBtn').addEventListener('click', () => {
      document.getElementById('folderInput').click();
    });

    document.getElementById('scrollTopBtn').addEventListener('click', () => {
      document.getElementById('viewerContent').scrollTop = 0;
    });

    document.getElementById('folderInput').addEventListener('change', handleFolderSelect);

    initSplitter();

    function handleFolderSelect(e) {
      const files = Array.from(e.target.files);
      if (files.length === 0) return;

      fileSystem = buildFileTree(files);
      tabs = [];
      activeTabIndex = -1;
      renderTree();
      renderTabs();
      updateBreadcrumb();
    }

    function buildFileTree(files) {
      const root = { name: '', children: new Map(), isFolder: true };

      files.forEach(file => {
        const parts = file.webkitRelativePath.split('/');
        let current = root;

        parts.forEach((part, index) => {
          if (!current.children.has(part)) {
            current.children.set(part, {
              name: part,
              children: new Map(),
              isFolder: index < parts.length - 1,
              file: index === parts.length - 1 ? file : null,
              path: file.webkitRelativePath
            });
          }
          current = current.children.get(part);
        });
      });

      return root;
    }

    function renderTree(node = null, parentEl = null, depth = 0) {
      if (!fileSystem) return;

      if (!node) {
        document.getElementById('tree').innerHTML = '';
        node = fileSystem;
        parentEl = document.getElementById('tree');
      }

      const sortedEntries = Array.from(node.children.values()).sort((a, b) => {
        if (a.isFolder !== b.isFolder) return a.isFolder ? -1 : 1;
        return a.name.localeCompare(b.name);
      });

      sortedEntries.forEach(item => {
        if (!item.name) return;

        const itemEl = document.createElement('div');
        itemEl.className = 'tree-item collapsed';
        itemEl.style.paddingLeft = depth * 12 + 'px';

        if (item.isFolder) {
          itemEl.innerHTML = `
            <div class="tree-folder">
              <div class="toggle">▶</div>
              <div class="icon">📁</div>
              <span>${escapeHtml(item.name)}</span>
            </div>
            <div class="children"></div>
          `;

          const toggle = itemEl.querySelector('.toggle');
          const childrenEl = itemEl.querySelector('.children');

          toggle.addEventListener('click', (e) => {
            e.stopPropagation();
            itemEl.classList.toggle('collapsed');
            toggle.textContent = itemEl.classList.contains('collapsed') ? '▶' : '▼';
          });

          itemEl.querySelector('.tree-folder').addEventListener('click', () => {
            toggle.click();
          });

          renderTree(item, childrenEl, depth + 1);
        } else if (item.name.endsWith('.md')) {
          itemEl.innerHTML = `
            <div class="tree-file md">
              <div class="icon">📄</div>
              <span>${escapeHtml(item.name)}</span>
            </div>
          `;

          itemEl.querySelector('.tree-file').addEventListener('click', () => {
            openTab(item);
          });
        }

        parentEl.appendChild(itemEl);
      });
    }

    function openTab(fileObj, anchor = null) {
      const existingIndex = tabs.findIndex(t => t.file.path === fileObj.path);
      
      if (existingIndex !== -1) {
        activeTabIndex = existingIndex;
      } else {
        tabs.push({
          file: fileObj,
          content: null
        });
        activeTabIndex = tabs.length - 1;
      }

      renderTabs();
      loadAndRenderTab(activeTabIndex, anchor);
      updateBreadcrumb();
    }

    function closeTab(index) {
      tabs.splice(index, 1);

      if (activeTabIndex >= tabs.length) {
        activeTabIndex = tabs.length - 1;
      }

      if (tabs.length === 0) {
        activeTabIndex = -1;
        showEmptyState();
      } else {
        loadAndRenderTab(activeTabIndex);
      }

      renderTabs();
      updateBreadcrumb();
    }

    function renderTabs() {
      const tabsContainer = document.getElementById('tabsContainer');
      tabsContainer.innerHTML = '';

      tabs.forEach((tab, index) => {
        const tabEl = document.createElement('div');
        tabEl.className = 'tab' + (index === activeTabIndex ? ' active' : '');

        const nameEl = document.createElement('span');
        nameEl.textContent = tab.file.name;

        const closeEl = document.createElement('div');
        closeEl.className = 'tab-close';
        closeEl.textContent = '×';

        closeEl.addEventListener('click', (e) => {
          e.stopPropagation();
          closeTab(index);
        });

        tabEl.appendChild(nameEl);
        tabEl.appendChild(closeEl);

        tabEl.addEventListener('click', () => {
          activeTabIndex = index;
          renderTabs();
          loadAndRenderTab(index);
          updateBreadcrumb();
        });

        tabsContainer.appendChild(tabEl);
      });
    }

    function loadAndRenderTab(index, anchorToScroll = null) {
      if (index < 0 || index >= tabs.length) return;

      const tab = tabs[index];

      if (tab.content) {
        renderTabContent(tab.content, tab.file.path, anchorToScroll);
      } else {
        // tab.file est un node avec {file: FileObject, path: string, ...}
        if (!tab.file || !tab.file.file || !(tab.file.file instanceof File)) {
          console.error('Invalid file object. Expected {file: File, path: string}', tab.file);
          return;
        }

        const reader = new FileReader();
        reader.onerror = (e) => {
          console.error('FileReader error:', e);
        };
        reader.onload = (e) => {
          const markdown = e.target.result;
          const html = marked.parse(markdown);
          tab.content = html;
          renderTabContent(html, tab.file.path, anchorToScroll);
        };
        reader.readAsText(tab.file.file);
      }
    }

    function renderTabContent(html, path, anchorToScroll = null) {
      const viewerContent = document.getElementById('viewerContent');
      const scrollTopBtn = document.getElementById('scrollTopBtn');
      
      // Toujours scroller en haut d'abord
      viewerContent.scrollTop = 0;
      
      // Wrapper pour traiter les headings
      const wrapper = document.createElement('div');
      wrapper.className = 'markdown-content';
      wrapper.innerHTML = html;

      // Générer les IDs pour les headings (forcer la régénération pour la consistance)
      wrapper.querySelectorAll('h1, h2, h3, h4, h5, h6').forEach(heading => {
        heading.id = generateSlug(heading.textContent);  // Toujours régénérer, pas de "if"
      });

      // Stocker le path du document courant pour les liens relatifs
      wrapper.dataset.docPath = path;

      viewerContent.innerHTML = '';
      viewerContent.appendChild(wrapper);

      // Afficher le bouton scroll top
      scrollTopBtn.style.display = 'inline-block';

      // Intercepter les clics sur les liens
      wrapper.querySelectorAll('a[href]').forEach(link => {
        link.addEventListener('click', (e) => {
          handleLinkClick(e, path);
        });
      });

      // Scroller vers l'ancre si spécifiée
      if (anchorToScroll) {
        setTimeout(() => {
          // Décoder au cas où ce soit URL-encodé
          const decodedAnchor = decodeURIComponent(anchorToScroll);
          const normalizedAnchor = normalizeAnchor(decodedAnchor);
          console.log('🔍 Cherche ancre:', {
            raw: anchorToScroll,
            decoded: decodedAnchor,
            normalized: normalizedAnchor
          });
          
          // Afficher tous les IDs disponibles
          const allHeadings = wrapper.querySelectorAll('h1, h2, h3, h4, h5, h6');
          const allIds = Array.from(allHeadings).map(h => ({
            id: h.id,
            text: h.textContent
          }));
          console.log('📋 IDs disponibles:', allIds);
          
          const target = wrapper.querySelector(`#${CSS.escape(normalizedAnchor)}`);
          if (target) {
            console.log('✅ Trouvé!', target);
            target.scrollIntoView({ behavior: 'smooth', block: 'start' });
          } else {
            console.warn('❌ Ancre non trouvée:', normalizedAnchor);
          }
        }, 50);
      }
    }

    function handleLinkClick(e, currentDocPath) {
      const href = e.target.getAttribute('href');
      
      // Ignorer les liens externes
      if (href.startsWith('http://') || href.startsWith('https://')) {
        return; // Laisser le comportement par défaut
      }

      e.preventDefault();

      // Cas 1 : Ancre pure (#section)
      if (href.startsWith('#')) {
        const anchor = href.substring(1);
        // Décoder l'URL encoding (eg: %C3%A8 → è)
        const decodedAnchor = decodeURIComponent(anchor);
        const normalizedAnchor = normalizeAnchor(decodedAnchor);
        console.log('⚓ Ancre interne:', {
          raw: anchor,
          decoded: decodedAnchor,
          normalized: normalizedAnchor
        });
        const target = document.querySelector(`#${CSS.escape(normalizedAnchor)}`);
        if (target) {
          console.log('✅ Ancre trouvée');
          target.scrollIntoView({ behavior: 'smooth', block: 'start' });
        } else {
          console.warn('❌ Ancre non trouvée');
        }
        return;
      }

      // Cas 2 : Lien relatif avec ou sans ancre (api.md ou api.md#endpoints)
      const [filePath, rawAnchor] = href.split('#');
      
      // Décoder l'ancre si elle est URL-encodée
      const anchor = rawAnchor ? decodeURIComponent(rawAnchor) : null;
      
      console.log('🔗 Lien inter-doc:', {
        href,
        filePath,
        anchor: anchor || '(none)',
        currentDoc: currentDocPath
      });
      
      // Résoudre le chemin relatif par rapport au doc courant
      const resolvedPath = resolveRelativePath(currentDocPath, filePath);
      
      // Chercher le fichier dans les tabs ou dans le fileSystem
      const matchingFile = findFileByPath(resolvedPath);
      
      if (matchingFile) {
        console.log('✅ Fichier trouvé:', resolvedPath);
        openTab(matchingFile, anchor);
      } else {
        console.warn(`❌ Fichier non trouvé: "${resolvedPath}" (depuis "${currentDocPath}", lien: "${filePath}")`);
      }
    }

    function resolveRelativePath(currentPath, relativePath) {
      // currentPath: "folder/subfolder/guide.md"
      // relativePath: "api.md" ou "../other/api.md"
      
      // Obtenir le dossier du doc courant
      const lastSlash = currentPath.lastIndexOf('/');
      const currentDir = lastSlash > -1 ? currentPath.substring(0, lastSlash) : '';
      
      // Construire le chemin initial
      let resolvedParts = currentDir ? currentDir.split('/') : [];
      const relativeParts = relativePath.split('/');

      // Traiter chaque partie du chemin relatif
      for (const part of relativeParts) {
        if (part === '..') {
          resolvedParts.pop();
        } else if (part !== '.' && part !== '') {
          resolvedParts.push(part);
        }
      }

      return resolvedParts.join('/');
    }

    function findFileByPath(targetPath) {
      if (!fileSystem) return null;

      // Chercher dans les tabs d'abord (fichiers déjà ouverts)
      for (let tab of tabs) {
        if (tab.file.path === targetPath) {
          return tab.file;  // Retourner le node complet (qui a .file et .path)
        }
      }

      // Chercher dans le fileSystem
      let current = fileSystem;
      const parts = targetPath.split('/').filter(p => p !== '');

      for (const part of parts) {
        if (!current.children.has(part)) {
          console.warn(`Path not found in tree. Looking for "${part}" in path "${targetPath}"`);
          console.warn('Available children:', Array.from(current.children.keys()));
          return null;
        }
        current = current.children.get(part);
      }

      // Vérifier que c'est bien un fichier (pas un dossier)
      if (!current || !current.file) {
        console.warn(`Node found but no file object in "${targetPath}"`);
        return null;
      }

      // Retourner le node COMPLET (qui a .file, .path, .children)
      // Pas juste current.file
      return current;
    }

    function generateSlug(text) {
      // "Section Française" → "section-francaise"
      return text
        .trim()
        .toLowerCase()
        .normalize('NFD')                         // Décomposer: é → e + accent
        .replace(/[\u0300-\u036f]/g, '')          // Supprimer les diacritiques
        .replace(/[^\w\s-]/g, '')                 // Caractères spéciaux restants
        .replace(/\s+/g, '-')                     // Espaces → tirets
        .replace(/-+/g, '-')                      // Tirets multiples → un seul
        .replace(/^-+|-+$/g, '');                 // Tirets début/fin
    }

    function normalizeAnchor(anchor) {
      // Normaliser les ancres comme les slugs générés pour les headings
      const normalized = generateSlug(anchor);
      // Log seulement si changement
      if (anchor !== normalized) {
        console.log('🔤 Normalisation ancre:', anchor, '→', normalized);
      }
      return normalized;
    }

    function showEmptyState() {
      const viewerContent = document.getElementById('viewerContent');
      const scrollTopBtn = document.getElementById('scrollTopBtn');
      scrollTopBtn.style.display = 'none';
      viewerContent.innerHTML = `
        <div class="empty-state">
          <p>👈 Sélectionnez un fichier .md à gauche pour commencer</p>
        </div>
      `;
    }

    function updateBreadcrumb() {
      if (!fileSystem) {
        document.getElementById('breadcrumb').textContent = 'Sélectionnez un dossier pour commencer';
      } else if (activeTabIndex >= 0 && activeTabIndex < tabs.length) {
        document.getElementById('breadcrumb').textContent = tabs[activeTabIndex].file.path;
      } else {
        const folderName = document.getElementById('folderInput').files[0]?.webkitRelativePath.split('/')[0] || 'Dossier';
        document.getElementById('breadcrumb').textContent = folderName;
      }
    }

    function escapeHtml(text) {
      const div = document.createElement('div');
      div.textContent = text;
      return div.innerHTML;
    }

    function initSplitter() {
      const splitter = document.getElementById('splitter');
      const explorer = document.querySelector('.explorer');
      const container = document.querySelector('.container');

      let isResizing = false;
      let startX = 0;
      let startWidth = 0;

      splitter.addEventListener('mousedown', (e) => {
        isResizing = true;
        startX = e.clientX;
        startWidth = explorer.offsetWidth;
        splitter.classList.add('dragging');
        document.body.style.userSelect = 'none';
      });

      document.addEventListener('mousemove', (e) => {
        if (!isResizing) return;

        const diff = e.clientX - startX;
        const newWidth = startWidth + diff;
        const containerWidth = container.offsetWidth;
        const minExplorer = 150;
        const minViewer = 300;

        if (newWidth >= minExplorer && containerWidth - newWidth >= minViewer) {
          explorer.style.width = newWidth + 'px';
        }
      });

      document.addEventListener('mouseup', () => {
        if (isResizing) {
          isResizing = false;
          splitter.classList.remove('dragging');
          document.body.style.userSelect = '';
        }
      });
    }
  </script>
</body>
</html>
